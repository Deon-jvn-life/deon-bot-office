<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Office</title><meta name="robots" content="noindex">
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#1c2128;font:15px system-ui;color:#c9d1d9}form{background:#262c34;padding:28px;border-radius:12px;width:280px}input,button{width:100%;box-sizing:border-box;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #3b434d;background:#1c2128;color:#e6edf3;font:inherit}button{background:#2f6f8f;border:0;cursor:pointer}#e{color:#e5838a;min-height:1.2em;margin-top:8px;font-size:13px}</style></head>
<body><form id="f"><div>Bot Office</div><input id="p" type="password" autocomplete="current-password" placeholder="Password" autofocus><button>Enter</button><div id="e"></div></form>
<script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(r.ok)location.href='/'+location.search;else{document.getElementById('e').textContent='Wrong password';p.value='';}}</script></body></html>
